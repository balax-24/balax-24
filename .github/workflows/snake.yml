name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#0f2a24&color_dots=#ebedf0,#c6f3e2,#8ff0c8,#3fbf8f,#0f7a55
            dist/snake-dark.svg?palette=github-dark&color_snake=#8ff0c8&color_dots=#161b22,#0f2a24,#1f5f4a,#3fbf8f,#8ff0c8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
